<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智创科技 - 线索管理后台</title>
<style>
:root {
  --bg: #0a0f1a; --card: #0f1420; --border: rgba(255,255,255,0.08);
  --blue: #00c6ff; --text: #e8edf5; --muted: #8b95a5;
  --green: #10b981; --gold: #f0a500;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans SC',-apple-system,sans-serif; min-height:100vh; }

.login-overlay { position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999; }
.login-box { background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;text-align:center; }
.login-box h2 { margin-bottom:8px;font-size:1.4rem; }
.login-box p { color:var(--muted);font-size:0.85rem;margin-bottom:24px; }
.login-box input { width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:1rem;text-align:center;outline:none;margin-bottom:16px; }
.login-box input:focus { border-color:var(--blue); }
.login-box button { width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--blue),#007a9e);color:#000;font-weight:700;font-size:1rem;cursor:pointer; }
.login-error { color:#ef4444;font-size:0.82rem;margin-top:12px;display:none; }

.main { max-width:1100px;margin:0 auto;padding:24px;display:none; }
.main.active { display:block; }
.header { display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:28px; }
.header h1 { font-size:1.3rem; }
.header h1 span { color:var(--blue); }
.header-actions { display:flex;gap:12px;align-items:center; }
.btn { padding:8px 20px;border-radius:20px;border:none;font-size:0.85rem;font-weight:600;cursor:pointer; }
.btn-refresh { background:rgba(0,198,255,0.1);color:var(--blue);border:1px solid rgba(0,198,255,0.2); }
.btn-refresh:hover { background:rgba(0,198,255,0.2); }
.btn-logout { background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border); }

.stats-bar { display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px; }
.stat-card { background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center; }
.stat-num { font-size:2rem;font-weight:900;color:var(--blue);line-height:1; }
.stat-label { font-size:0.82rem;color:var(--muted);margin-top:6px; }

.leads-table { background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden; }
.leads-table table { width:100%;border-collapse:collapse; }
.leads-table th { background:rgba(0,198,255,0.04);padding:14px 16px;text-align:left;font-size:0.8rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:1px; }
.leads-table td { padding:14px 16px;font-size:0.88rem;border-bottom:1px solid var(--border); }
.leads-table tr:last-child td { border-bottom:none; }
.leads-table tr:hover td { background:rgba(0,198,255,0.03); }
.need-cell { max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.source-tag { display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.72rem;background:rgba(0,198,255,0.1);color:var(--blue); }
.empty-state { text-align:center;padding:60px 20px;color:var(--muted); }
.empty-state .icon { font-size:3rem;margin-bottom:16px; }

.loading { text-align:center;padding:60px 20px; }
.spinner { width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px; }
@keyframes spin { to{transform:rotate(360deg)} }

.error-banner { background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:16px 20px;margin-bottom:20px;display:none; }
.error-banner.show { display:block; }
.error-banner p { color:#ef4444;font-size:0.88rem; }
.error-banner .hint { color:var(--muted);font-size:0.8rem;margin-top:4px; }

.auto-refresh { font-size:0.75rem;color:var(--muted); }
.auto-refresh.enabled { color:var(--green); }

@media (max-width:768px) {
  .login-box { width:90%;padding:28px 20px; }
  .stats-bar { grid-template-columns:1fr 1fr; }
  .leads-table { overflow-x:auto; }
  .leads-table table { min-width:600px; }
}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🔐 线索管理后台</h2>
    <p>请输入管理密码</p>
    <input type="password" id="pwdInput" placeholder="输入密码" autofocus>
    <button onclick="doLogin()">登录</button>
    <div class="login-error" id="loginError">密码错误，请重试</div>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="header">
    <h1>智创科技 · <span>线索管理</span></h1>
    <div class="header-actions">
      <span class="auto-refresh" id="autoRefreshStatus">自动刷新: 30s</span>
      <button class="btn btn-refresh" onclick="loadLeads()">🔄 刷新</button>
      <button class="btn btn-logout" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner">
    <p>⚠️ API 服务不可用</p>
    <p class="hint">Pages Functions 未正常运行。请在 Cloudflare Dashboard → Pages → zhi-chuang-tech → 设置中检查 Functions 是否已启用，并确认 KV 绑定 ZC_LEADS 已配置。</p>
  </div>

  <div class="stats-bar" id="statsBar"></div>
  <div class="leads-table" id="leadsTable"></div>
</div>

<script>
const ADMIN_PASSWORD = 'admin888';

function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainContent').classList.add('active');
    sessionStorage.setItem('admin_logged_in', '1');
    loadLeads();
    setInterval(loadLeads, 30000);
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('pwdInput').value = '';
  }
}

document.getElementById('pwdInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

function logout() {
  sessionStorage.removeItem('admin_logged_in');
  location.reload();
}

// Auto-login if already logged in
if (sessionStorage.getItem('admin_logged_in') === '1') {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('mainContent').classList.add('active');
  loadLeads();
  setInterval(loadLeads, 30000);
}

async function loadLeads() {
  const statsBar = document.getElementById('statsBar');
  const leadsTable = document.getElementById('leadsTable');
  const errorBanner = document.getElementById('errorBanner');
  const refreshStatus = document.getElementById('autoRefreshStatus');

  leadsTable.innerHTML = '<div class="loading"><div class="spinner"></div><div>加载中...</div></div>';
  errorBanner.classList.remove('show');
  refreshStatus.classList.remove('enabled');

  try {
    const res = await fetch('/api/leads');
    const contentType = res.headers.get('content-type') || '';

    if (!res.ok || !contentType.includes('application/json')) {
      throw new Error('API not available');
    }

    const data = await res.json();
    refreshStatus.classList.add('enabled');

    // Stats
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay());
    weekStart.setHours(0,0,0,0);

    const todayCount = data.leads.filter(l => new Date(l.created_at) >= todayStart).length;
    const weekCount = data.leads.filter(l => new Date(l.created_at) >= weekStart).length;

    statsBar.innerHTML = `
      <div class="stat-card"><div class="stat-num">${data.total || 0}</div><div class="stat-label">总线索数</div></div>
      <div class="stat-card"><div class="stat-num">${todayCount}</div><div class="stat-label">今日新增</div></div>
      <div class="stat-card"><div class="stat-num">${weekCount}</div><div class="stat-label">本周新增</div></div>
    `;

    // Table
    if (!data.leads || data.leads.length === 0) {
      leadsTable.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无线索数据</div></div>';
      return;
    }

    const rows = data.leads.map((l, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${esc(l.name)}</strong></td>
        <td><a href="tel:${esc(l.phone)}" style="color:var(--blue);text-decoration:none;">${esc(l.phone)}</a></td>
        <td class="need-cell" title="${esc(l.need || '')}">${esc(l.need || '-')}</td>
        <td><span class="source-tag">${esc(l.source || 'AI客服')}</span></td>
        <td style="color:var(--muted);font-size:0.82rem;">${esc(l.created_at_cn || formatDate(l.created_at))}</td>
      </tr>
    `).join('');

    leadsTable.innerHTML = `
      <table>
        <thead><tr><th>#</th><th>姓名</th><th>电话</th><th>需求</th><th>来源</th><th>时间</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } catch (err) {
    errorBanner.classList.add('show');
    statsBar.innerHTML = `<div class="stat-card"><div class="stat-num" style="color:var(--gold);">--</div><div class="stat-label">数据不可用</div></div>
    <div class="stat-card"><div class="stat-num">--</div><div class="stat-label">--</div></div>
    <div class="stat-card"><div class="stat-num">--</div><div class="stat-label">--</div></div>`;
    leadsTable.innerHTML = '<div class="empty-state"><div class="icon">🔌</div><div>无法连接线索服务</div><div style="font-size:0.82rem;margin-top:8px;color:var(--muted);">请确认 Cloudflare Pages Functions 已正确配置并部署。</div></div>';
  }
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
}
</script>
</body>
</html>
